<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUẢN LÝ DANH SÁCH CÁN BỘ</title>
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS Library -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>

    <style>
        :root {
            --primary-color: #1976d2;
            --primary-dark: #1565c0;
            --secondary-color: #f5f5f5;
            --accent-green: #2e7d32;
            --accent-orange: #ed6c02;
            --accent-red: #d32f2f;
            --text-color: #333333;
            --text-light: #666666;
            --card-bg: #ffffff;
            --border-color: #e0e0e0;
            --radius: 12px;
            --shadow: 0 4px 12px rgba(0,0,0,0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: var(--text-color);
            padding-bottom: 40px;
        }

        /* Header */
        .app-header {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: white;
            padding: 16px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .app-header h1 {
            font-size: 1.25rem;
            font-weight: 500;
        }

        .container {
            padding: 12px;
            max-width: 900px;
            margin: 0 auto;
        }

        /* Cards */
        .stats-card, .toolbar-card, .table-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
        }

        .stats-card {
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .stat-item i { font-size: 1.8rem; }
        .stat-item span { font-size: 1.2rem; font-weight: 700; display: block; }
        .stat-item small { color: var(--text-light); font-size: 0.75rem; }

        .text-blue { color: var(--primary-color); }
        .text-green { color: var(--accent-green); }
        .text-orange { color: var(--accent-orange); }

        .search-box {
            position: relative;
            margin-bottom: 12px;
        }

        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
        }

        .search-box input {
            width: 100%;
            padding: 12px 12px 12px 40px;
            border: 1px solid var(--border-color);
            border-radius: 25px;
            font-size: 0.95rem;
            outline: none;
        }

        .filters-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }

        .filters-grid select {
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: white;
            font-size: 0.85rem;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            min-width: 110px;
            padding: 10px 14px;
            border: none;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: 0.2s;
        }

        .btn-primary { background: var(--primary-color); color: white; }
        .btn-success { background: var(--accent-green); color: white; }
        .btn-info { background: #0288d1; color: white; }
        .btn-danger { background: var(--accent-red); color: white; }
        .btn-secondary { background: #e0e0e0; color: #333; }
        .btn-outline { border: 1px solid var(--primary-color); color: var(--primary-color); background: transparent; }

        .btn:active { transform: scale(0.98); }

        .table-responsive { overflow-x: auto; }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        th, td {
            padding: 12px 8px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
        }

        th { background-color: #fafafa; color: var(--text-light); font-weight: 500; }

        .avatar-wrapper {
            position: relative;
            display: inline-block;
            cursor: pointer;
        }

        .avatar-circle {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary-color);
            display: block;
        }

        .camera-badge {
            position: absolute;
            bottom: -2px;
            right: -2px;
            background: var(--primary-color);
            color: white;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1.5px solid white;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-top: 16px;
        }

        .pagination button {
            padding: 6px 12px;
            border: 1px solid var(--border-color);
            background: white;
            border-radius: 4px;
            cursor: pointer;
        }

        .pagination button.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        /* Modals */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active { display: flex; }

        .modal-content {
            background: white;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            border-radius: var(--radius);
            padding: 20px;
            position: relative;
        }

        .close-btn {
            position: absolute;
            right: 16px;
            top: 12px;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-light);
            z-index: 10;
        }

        /* Live Camera UI */
        .camera-container {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #camera-video {
            width: 100%;
            max-height: 360px;
            object-fit: cover;
            background: #111;
        }

        .camera-controls {
            display: flex;
            justify-content: space-around;
            width: 100%;
            padding: 12px;
            background: rgba(0,0,0,0.8);
        }

        .btn-capture-snap {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #ffffff;
            border: 4px solid var(--primary-color);
            color: var(--primary-color);
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        .btn-switch-cam {
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
        }

        /* Detail Modal */
        .detail-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .detail-avatar-container {
            position: relative;
            display: inline-block;
            cursor: pointer;
        }

        .detail-avatar-large {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--primary-color);
            box-shadow: var(--shadow);
        }

        .detail-camera-icon {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: var(--primary-color);
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid white;
        }

        .phone-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--accent-green);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 12px;
        }

        .detail-info-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px dashed var(--border-color);
        }

        /* Form Controls */
        .form-group { margin-bottom: 12px; }
        .form-row { display: flex; gap: 10px; }
        .form-row .form-group { flex: 1; }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-light);
            margin-bottom: 4px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .avatar-upload-section {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 16px;
        }

        #form-avatar-preview {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary-color);
            cursor: pointer;
        }

        .form-actions { display: flex; gap: 10px; margin-top: 20px; }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #323232;
            color: white;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 0.85rem;
            display: none;
            z-index: 2000;
        }

        .undo-toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #323232;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            display: none;
            align-items: center;
            gap: 15px;
            z-index: 2000;
        }

        .undo-toast button {
            background: none;
            border: none;
            color: #ffeb3b;
            font-weight: bold;
            cursor: pointer;
        }

        .loading-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 3000;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        @media (max-width: 600px) {
            .filters-grid { grid-template-columns: 1fr; }
            th:nth-child(5), td:nth-child(5) { display: none; }
        }
    </style>
</head>
<body>

    <header class="app-header">
        <h1><i class="fa-solid fa-users-gear"></i> QUẢN LÝ DANH SÁCH CÁN BỘ</h1>
    </header>

    <div class="container">
        <!-- Thống kê -->
        <section class="stats-card">
            <div class="stat-item">
                <i class="fa-solid fa-user-group text-blue"></i>
                <div>
                    <span id="stat-total">0</span>
                    <small>Tổng số</small>
                </div>
            </div>
            <div class="stat-item">
                <i class="fa-solid fa-building-flag text-green"></i>
                <div>
                    <span id="stat-tdp">0</span>
                    <small>Tổ dân phố</small>
                </div>
            </div>
            <div class="stat-item">
                <i class="fa-solid fa-id-card text-orange"></i>
                <div>
                    <span id="stat-chucvu">0</span>
                    <small>Chức vụ</small>
                </div>
            </div>
        </section>

        <!-- Tìm kiếm & Bộ lọc -->
        <section class="toolbar-card">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="input-search" placeholder="Tìm nhanh (Họ tên, SĐT, TDP, Chức vụ)..." oninput="renderTable()">
            </div>

            <div class="filters-grid">
                <select id="filter-tdp" onchange="renderTable()">
                    <option value="">-- Tất cả Tổ dân phố --</option>
                </select>
                <select id="filter-chucvu" onchange="renderTable()">
                    <option value="">-- Tất cả Chức vụ --</option>
                </select>
                <select id="sort-by" onchange="renderTable()">
                    <option value="tt-asc">Sắp xếp: TT tăng dần</option>
                    <option value="name-asc">Sắp xếp: Tên A → Z</option>
                </select>
            </div>

            <div class="action-buttons">
                <button class="btn btn-primary" onclick="openFormModal()"><i class="fa-solid fa-user-plus"></i> Thêm mới</button>
                <button class="btn btn-success" onclick="exportToExcel()"><i class="fa-solid fa-file-excel"></i> Xuất Excel</button>
                <label class="btn btn-info">
                    <i class="fa-solid fa-file-import"></i> Nhập Excel
                    <input type="file" id="excel-file-input" accept=".xlsx, .xls" style="display: none;" onchange="importFromExcel(event)">
                </label>
            </div>
        </section>

        <!-- Bảng danh sách -->
        <section class="table-card">
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>TT</th>
                            <th>Ảnh</th>
                            <th>Họ tên</th>
                            <th>Chức vụ</th>
                            <th>Tổ dân phố</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>
            <div class="pagination" id="pagination"></div>
        </section>
    </div>

    <!-- MODAL CHỤP ẢNH LIVE CAMERA -->
    <div id="modal-camera" class="modal">
        <div class="modal-content" style="max-width: 420px; padding: 12px; background: #000;">
            <span class="close-btn" style="color:#fff;" onclick="closeCameraModal()">&times;</span>
            <h3 style="color:#fff; font-size:1rem; margin-bottom:12px; text-align:center;">
                <i class="fa-solid fa-camera"></i> Chụp ảnh cán bộ
            </h3>
            
            <div class="camera-container">
                <video id="camera-video" autoplay playsinline></video>
                <canvas id="camera-canvas" style="display:none;"></canvas>
                
                <div class="camera-controls">
                    <button type="button" class="btn-switch-cam" onclick="toggleCameraFacing()" title="Đổi camera">
                        <i class="fa-solid fa-rotate"></i>
                    </button>
                    <button type="button" class="btn-capture-snap" onclick="takeLiveSnap()" title="Bấm để chụp">
                        <i class="fa-solid fa-camera"></i>
                    </button>
                    <div style="width: 44px;"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- INPUT FALLBACK CAMERA HỆ THỐNG -->
    <input type="file" id="fallback-camera-input" accept="image/*" capture="environment" style="display: none;" onchange="handleFallbackCamera(event)">

    <!-- Modal Xem Chi Tiết -->
    <div id="modal-detail" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('modal-detail')">&times;</span>
            <div id="detail-card-body"></div>
        </div>
    </div>

    <!-- Modal Thêm / Chỉnh Sửa -->
    <div id="modal-form" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('modal-form')">&times;</span>
            <h2 id="form-title" style="margin-bottom:16px; font-size:1.1rem; color:var(--primary-color);">Thêm cán bộ mới</h2>
            <form id="person-form" onsubmit="handleFormSubmit(event)">
                <input type="hidden" id="form-id">
                
                <div class="avatar-upload-section">
                    <div class="avatar-wrapper" onclick="startCameraMode('form')">
                        <img id="form-avatar-preview" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 24 24' fill='%23ccc'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/></svg>" alt="Preview">
                        <div class="camera-badge"><i class="fa-solid fa-camera"></i></div>
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 8px;">
                        <button type="button" class="btn btn-sm btn-primary" onclick="startCameraMode('form')">
                            <i class="fa-solid fa-camera"></i> Mở Camera
                        </button>
                        <label class="btn btn-sm btn-outline">
                            <i class="fa-solid fa-image"></i> Chọn file ảnh
                            <input type="file" id="form-avatar-file" accept="image/*" style="display: none;" onchange="handleFileInput(event)">
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label>Họ tên *</label>
                    <input type="text" id="form-hoten" required placeholder="Nhập họ và tên">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Năm sinh</label>
                        <input type="number" id="form-namsinh" placeholder="YYYY">
                    </div>
                    <div class="form-group">
                        <label>Giới tính</label>
                        <select id="form-gioitinh">
                            <option value="Nam">Nam</option>
                            <option value="Nữ">Nữ</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Chức vụ *</label>
                        <input type="text" id="form-chucvu" required placeholder="Ví dụ: Tổ trưởng">
                    </div>
                    <div class="form-group">
                        <label>Tổ dân phố *</label>
                        <input type="text" id="form-tdp" required placeholder="Ví dụ: TDP 05">
                    </div>
                </div>
                <div class="form-group">
                    <label>Số điện thoại</label>
                    <input type="tel" id="form-sdt" placeholder="09xxxxxxx">
                </div>
                <div class="form-group">
                    <label>Nơi cư trú</label>
                    <input type="text" id="form-noicutru" placeholder="Địa chỉ chi tiết">
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('modal-form')">Hủy</button>
                    <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> Lưu thông tin</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast & Loading -->
    <div id="toast" class="toast"></div>
    <div id="undo-toast" class="undo-toast">
        <span>Đã xóa cán bộ.</span>
        <button onclick="undoDelete()">HOÀN TÁC</button>
    </div>
    
    <div id="loading" class="loading-overlay">
        <div class="spinner"></div>
    </div>

    <script>
        let staffList = [];
        let lastDeletedStaff = null;
        let lastDeletedIndex = null;
        let undoTimeout = null;
        
        let mediaStream = null;
        let activeFacingMode = "environment"; 
        let cameraTargetMode = null; 
        let currentTargetTT = null;

        const ITEMS_PER_PAGE = 8;
        let currentPage = 1;

        const DEFAULT_AVATAR = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 24 24' fill='%23ccc'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/></svg>";
        const STORAGE_KEY = "CAN_BO_LOCAL_DATA";

        document.addEventListener("DOMContentLoaded", () => {
            loadInitialData();
        });

        function loadInitialData() {
            const localData = localStorage.getItem(STORAGE_KEY);
            if (localData) {
                try { staffList = JSON.parse(localData); } catch (e) { staffList = []; }
            } else {
                staffList = [
                    { TT: 1, HoTen: "Nguyễn Văn An", NamSinh: 1980, GioiTinh: "Nam", ChucVu: "Tổ trưởng", ToDanPho: "TDP 01", SoDienThoai: "0912345678", NoiCuTru: "Số 12, Đường A, TDP 01", Anh: "" },
                    { TT: 2, HoTen: "Trần Thị Bình", NamSinh: 1985, GioiTinh: "Nữ", ChucVu: "Tổ phó", ToDanPho: "TDP 02", SoDienThoai: "0987654321", NoiCuTru: "Số 45, Đường B, TDP 02", Anh: "" }
                ];
                saveToLocalStorage();
            }
            updateDropdownFilters();
            renderTable();
        }

        function saveToLocalStorage() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(staffList));
            updateStats();
        }

        function updateStats() {
            document.getElementById("stat-total").innerText = staffList.length;
            const tdpSet = new Set(staffList.map(item => item.ToDanPho).filter(Boolean));
            document.getElementById("stat-tdp").innerText = tdpSet.size;
            const chucVuSet = new Set(staffList.map(item => item.ChucVu).filter(Boolean));
            document.getElementById("stat-chucvu").innerText = chucVuSet.size;
        }

        function updateDropdownFilters() {
            const filterTdp = document.getElementById("filter-tdp");
            const filterChucvu = document.getElementById("filter-chucvu");

            const currentTdp = filterTdp.value;
            const currentChucvu = filterChucvu.value;

            const tdpList = [...new Set(staffList.map(i => i.ToDanPho).filter(Boolean))];
            const chucVuList = [...new Set(staffList.map(i => i.ChucVu).filter(Boolean))];

            filterTdp.innerHTML = '<option value="">-- Tất cả Tổ dân phố --</option>' + 
                tdpList.map(t => `<option value="${t}">${t}</option>`).join('');
            
            filterChucvu.innerHTML = '<option value="">-- Tất cả Chức vụ --</option>' + 
                chucVuList.map(c => `<option value="${c}">${c}</option>`).join('');

            filterTdp.value = currentTdp;
            filterChucvu.value = currentChucvu;
        }

        function getFilteredData() {
            const keyword = document.getElementById("input-search").value.toLowerCase().trim();
            const selectedTdp = document.getElementById("filter-tdp").value;
            const selectedChucvu = document.getElementById("filter-chucvu").value;
            const sortBy = document.getElementById("sort-by").value;

            let result = staffList.filter(item => {
                const matchKeyword = !keyword || 
                    (item.HoTen && item.HoTen.toLowerCase().includes(keyword)) ||
                    (item.SoDienThoai && item.SoDienThoai.includes(keyword)) ||
                    (item.ToDanPho && item.ToDanPho.toLowerCase().includes(keyword)) ||
                    (item.ChucVu && item.ChucVu.toLowerCase().includes(keyword));

                const matchTdp = !selectedTdp || item.ToDanPho === selectedTdp;
                const matchChucvu = !selectedChucvu || item.ChucVu === selectedChucvu;

                return matchKeyword && matchTdp && matchChucvu;
            });

            if (sortBy === "name-asc") {
                result.sort((a, b) => (a.HoTen || "").localeCompare(b.HoTen || "", 'vi', { sensitivity: 'base' }));
            } else {
                result.sort((a, b) => (Number(a.TT) || 0) - (Number(b.TT) || 0));
            }

            return result;
        }

        function renderTable() {
            const data = getFilteredData();
            const tbody = document.getElementById("table-body");
            tbody.innerHTML = "";

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color: #888;">Không tìm thấy dữ liệu.</td></tr>`;
                renderPagination(0);
                return;
            }

            const totalPages = Math.ceil(data.length / ITEMS_PER_PAGE);
            if (currentPage > totalPages) currentPage = totalPages || 1;
            
            const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
            const pageData = data.slice(startIndex, startIndex + ITEMS_PER_PAGE);

            pageData.forEach(item => {
                const tr = document.createElement("tr");
                const avatarSrc = item.Anh ? item.Anh : DEFAULT_AVATAR;

                tr.innerHTML = `
                    <td><b>${item.TT}</b></td>
                    <td>
                        <div class="avatar-wrapper" onclick="startCameraMode('table_row', ${item.TT})" title="Bấm để chụp ảnh">
                            <img src="${avatarSrc}" class="avatar-circle" alt="Avatar">
                            <div class="camera-badge"><i class="fa-solid fa-camera"></i></div>
                        </div>
                    </td>
                    <td><a href="javascript:void(0)" onclick="openDetailModal(${item.TT})" style="text-decoration:none; color:var(--primary-color); font-weight:500;"><i class="fa-solid fa-user"></i> ${item.HoTen}</a></td>
                    <td>${item.ChucVu || ''}</td>
                    <td>${item.ToDanPho || ''}</td>
                    <td>
                        <button class="btn btn-sm btn-outline" onclick="openFormModal(${item.TT})" title="Sửa"><i class="fa-solid fa-pen"></i></button>
                        <button class="btn btn-sm btn-danger" onclick="confirmDelete(${item.TT})" title="Xóa"><i class="fa-solid fa-trash"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            renderPagination(totalPages);
            updateStats();
        }

        /* ----- WEBRTC LIVE CAMERA & FALLBACK HYBRID LOGIC ----- */
        async function startCameraMode(mode, tt = null) {
            cameraTargetMode = mode;
            currentTargetTT = tt;

            // Kiểm tra điều kiện có thể dùng Live WebRTC không
            const isSecureContext = window.isSecureContext || location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';

            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !isSecureContext) {
                // Tự động chuyển sang Camera hệ thống nếu môi trường là HTTP/File local
                triggerFallbackCamera();
                return;
            }

            document.getElementById("modal-camera").classList.add("active");
            await openCameraStream();
        }

        function triggerFallbackCamera() {
            const input = document.getElementById("fallback-camera-input");
            input.value = "";
            input.click();
        }

        function handleFallbackCamera(event) {
            const file = event.target.files[0];
            if (!file) return;

            showLoading(true);
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement("canvas");
                    canvas.width = 300;
                    canvas.height = 300;
                    const ctx = canvas.getContext("2d");

                    const minDim = Math.min(img.width, img.height);
                    const startX = (img.width - minDim) / 2;
                    const startY = (img.height - minDim) / 2;

                    ctx.drawImage(img, startX, startY, minDim, minDim, 0, 0, 300, 300);
                    const base64Url = canvas.toDataURL("image/jpeg", 0.75);

                    applyCapturedImage(base64Url);
                    showLoading(false);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        async function openCameraStream() {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
            }

            showLoading(true);
            try {
                const constraints = {
                    video: {
                        facingMode: activeFacingMode,
                        width: { ideal: 640 },
                        height: { ideal: 640 }
                    },
                    audio: false
                };

                mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
                const videoEl = document.getElementById("camera-video");
                videoEl.srcObject = mediaStream;
            } catch (err) {
                console.warn("Live Camera Error, switching to Fallback Mode:", err);
                closeCameraModal();
                triggerFallbackCamera();
            } finally {
                showLoading(false);
            }
        }

        function toggleCameraFacing() {
            activeFacingMode = (activeFacingMode === "environment") ? "user" : "environment";
            openCameraStream();
        }

        function takeLiveSnap() {
            const videoEl = document.getElementById("camera-video");
            const canvas = document.getElementById("camera-canvas");

            if (!videoEl.videoWidth) {
                showToast("Camera chưa sẵn sàng!", "error");
                return;
            }

            canvas.width = 300;
            canvas.height = 300;
            const ctx = canvas.getContext("2d");

            const minDim = Math.min(videoEl.videoWidth, videoEl.videoHeight);
            const startX = (videoEl.videoWidth - minDim) / 2;
            const startY = (videoEl.videoHeight - minDim) / 2;

            ctx.drawImage(videoEl, startX, startY, minDim, minDim, 0, 0, 300, 300);
            const base64Url = canvas.toDataURL("image/jpeg", 0.75);

            applyCapturedImage(base64Url);
            closeCameraModal();
        }

        function applyCapturedImage(base64Url) {
            if (cameraTargetMode === 'table_row' && currentTargetTT !== null) {
                const index = staffList.findIndex(i => Number(i.TT) === Number(currentTargetTT));
                if (index !== -1) {
                    staffList[index].Anh = base64Url;
                    saveToLocalStorage();
                    renderTable();

                    const modalDetail = document.getElementById("modal-detail");
                    if (modalDetail.classList.contains("active")) {
                        openDetailModal(currentTargetTT);
                    }
                    showToast("Đã lưu ảnh cán bộ!", "success");
                }
            } else if (cameraTargetMode === 'form') {
                document.getElementById("form-avatar-preview").src = base64Url;
                showToast("Đã chọn ảnh thành công!", "success");
            }
        }

        function closeCameraModal() {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }
            document.getElementById("modal-camera").classList.remove("active");
        }

        function renderPagination(totalPages) {
            const container = document.getElementById("pagination");
            container.innerHTML = "";

            if (totalPages <= 1) return;

            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement("button");
                btn.innerText = i;
                if (i === currentPage) btn.classList.add("active");
                btn.onclick = () => {
                    currentPage = i;
                    renderTable();
                };
                container.appendChild(btn);
            }
        }

        function openDetailModal(tt) {
            const person = staffList.find(i => Number(i.TT) === Number(tt));
            if (!person) return;

            const detailBody = document.getElementById("detail-card-body");
            const avatarSrc = person.Anh ? person.Anh : DEFAULT_AVATAR;
            const mapUrl = person.NoiCuTru ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(person.NoiCuTru)}` : "#";

            detailBody.innerHTML = `
                <div class="detail-header">
                    <div class="detail-avatar-container" onclick="startCameraMode('table_row', ${person.TT})" title="Bấm để chụp lại ảnh">
                        <img src="${avatarSrc}" class="detail-avatar-large" alt="Avatar">
                        <div class="detail-camera-icon"><i class="fa-solid fa-camera"></i></div>
                    </div>
                    <h2 style="margin-top:8px;">${person.HoTen}</h2>
                    <p style="color:var(--text-light); margin-top:4px;">${person.ChucVu} - ${person.ToDanPho}</p>
                    <p style="font-size:0.8rem; color:var(--primary-color); margin-top:4px;"><i class="fa-solid fa-hand-pointer"></i> Bấm vào ảnh để chụp lại</p>
                    ${person.SoDienThoai ? `
                        <a href="tel:${person.SoDienThoai}" class="phone-btn">
                            <i class="fa-solid fa-phone"></i> Gọi ngay: ${person.SoDienThoai}
                        </a>
                    ` : ''}
                </div>
                <div>
                    <div class="detail-info-item"><label>TT:</label> <span>${person.TT}</span></div>
                    <div class="detail-info-item"><label>Năm sinh:</label> <span>${person.NamSinh || 'N/A'}</span></div>
                    <div class="detail-info-item"><label>Giới tính:</label> <span>${person.GioiTinh || 'N/A'}</span></div>
                    <div class="detail-info-item"><label>Chức vụ:</label> <span>${person.ChucVu || 'N/A'}</span></div>
                    <div class="detail-info-item"><label>Tổ dân phố:</label> <span>${person.ToDanPho || 'N/A'}</span></div>
                    <div class="detail-info-item">
                        <label>Nơi cư trú:</label> 
                        <span>
                            ${person.NoiCuTru || 'N/A'} 
                            ${person.NoiCuTru ? `<a href="${mapUrl}" target="_blank" style="color:var(--primary-color); margin-left:5px;"><i class="fa-solid fa-location-dot"></i> Bản đồ</a>` : ''}
                        </span>
                    </div>
                </div>
            `;

            document.getElementById("modal-detail").classList.add("active");
        }

        function openFormModal(tt = null) {
            const form = document.getElementById("person-form");
            form.reset();
            document.getElementById("form-avatar-preview").src = DEFAULT_AVATAR;

            if (tt !== null) {
                const person = staffList.find(i => Number(i.TT) === Number(tt));
                if (!person) return;

                document.getElementById("form-title").innerText = "Chỉnh sửa thông tin Cán bộ";
                document.getElementById("form-id").value = person.TT;
                document.getElementById("form-hoten").value = person.HoTen || "";
                document.getElementById("form-namsinh").value = person.NamSinh || "";
                document.getElementById("form-gioitinh").value = person.GioiTinh || "Nam";
                document.getElementById("form-chucvu").value = person.ChucVu || "";
                document.getElementById("form-tdp").value = person.ToDanPho || "";
                document.getElementById("form-sdt").value = person.SoDienThoai || "";
                document.getElementById("form-noicutru").value = person.NoiCuTru || "";
                if (person.Anh) {
                    document.getElementById("form-avatar-preview").src = person.Anh;
                }
            } else {
                document.getElementById("form-title").innerText = "Thêm mới cán bộ";
                document.getElementById("form-id").value = "";
            }

            document.getElementById("modal-form").classList.add("active");
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove("active");
        }

        function handleFormSubmit(e) {
            e.preventDefault();

            const id = document.getElementById("form-id").value;
            const hoTen = document.getElementById("form-hoten").value.trim();
            const namSinh = document.getElementById("form-namsinh").value;
            const gioiTinh = document.getElementById("form-gioitinh").value;
            const chucVu = document.getElementById("form-chucvu").value.trim();
            const toDanPho = document.getElementById("form-tdp").value.trim();
            const sdt = document.getElementById("form-sdt").value.trim();
            const noiCuTru = document.getElementById("form-noicutru").value.trim();
            const avatarSrc = document.getElementById("form-avatar-preview").src;

            const anhData = avatarSrc.startsWith("data:image") && !avatarSrc.includes("svg") ? avatarSrc : "";

            if (id) {
                const index = staffList.findIndex(i => Number(i.TT) === Number(id));
                if (index !== -1) {
                    staffList[index] = {
                        ...staffList[index],
                        HoTen: hoTen,
                        NamSinh: namSinh,
                        GioiTinh: gioiTinh,
                        ChucVu: chucVu,
                        ToDanPho: toDanPho,
                        SoDienThoai: sdt,
                        NoiCuTru: noiCuTru,
                        Anh: anhData || staffList[index].Anh
                    };
                    showToast("Đã cập nhật thông tin!", "success");
                }
            } else {
                const maxTT = staffList.reduce((max, item) => Math.max(max, Number(item.TT) || 0), 0);
                const newPerson = {
                    TT: maxTT + 1,
                    HoTen: hoTen,
                    NamSinh: namSinh,
                    GioiTinh: gioiTinh,
                    ChucVu: chucVu,
                    ToDanPho: toDanPho,
                    SoDienThoai: sdt,
                    NoiCuTru: noiCuTru,
                    Anh: anhData
                };
                staffList.push(newPerson);
                showToast("Đã thêm cán bộ mới!", "success");
            }

            autoReindexTT();
            saveToLocalStorage();
            updateDropdownFilters();
            renderTable();
            closeModal("modal-form");
        }

        function autoReindexTT() {
            staffList.forEach((item, index) => {
                item.TT = index + 1;
            });
        }

        function confirmDelete(tt) {
            if (!confirm(`Bạn có chắc chắn muốn xóa cán bộ có TT ${tt}?`)) return;

            const index = staffList.findIndex(i => Number(i.TT) === Number(tt));
            if (index !== -1) {
                lastDeletedStaff = staffList[index];
                lastDeletedIndex = index;

                staffList.splice(index, 1);
                autoReindexTT();
                saveToLocalStorage();
                updateDropdownFilters();
                renderTable();

                showUndoToast();
            }
        }

        function showUndoToast() {
            const toast = document.getElementById("undo-toast");
            toast.style.display = "flex";

            if (undoTimeout) clearTimeout(undoTimeout);

            undoTimeout = setTimeout(() => {
                toast.style.display = "none";
                lastDeletedStaff = null;
            }, 5000);
        }

        function undoDelete() {
            if (lastDeletedStaff !== null) {
                staffList.splice(lastDeletedIndex, 0, lastDeletedStaff);
                autoReindexTT();
                saveToLocalStorage();
                updateDropdownFilters();
                renderTable();

                document.getElementById("undo-toast").style.display = "none";
                showToast("Đã hoàn tác dữ liệu!", "success");
                lastDeletedStaff = null;
            }
        }

        function handleFileInput(e) {
            const file = e.target.files[0];
            if (!file) return;

            showLoading(true);
            const reader = new FileReader();
            reader.onload = function(evt) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement("canvas");
                    canvas.width = 300;
                    canvas.height = 300;
                    const ctx = canvas.getContext("2d");
                    ctx.drawImage(img, 0, 0, 300, 300);
                    document.getElementById("form-avatar-preview").src = canvas.toDataURL("image/jpeg", 0.75);
                    showLoading(false);
                };
                img.src = evt.target.result;
            };
            reader.readAsDataURL(file);
        }

        function importFromExcel(e) {
            const file = e.target.files[0];
            if (!file) return;

            showLoading(true);
            const reader = new FileReader();

            reader.onload = function(evt) {
                try {
                    const data = new Uint8Array(evt.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });

                    const sheetName = workbook.SheetNames.includes("DanhSach") ? "DanhSach" : workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[sheetName];
                    const json = XLSX.utils.sheet_to_json(worksheet, { defval: "" });

                    if (json.length === 0) {
                        showToast("File Excel trống!", "error");
                        showLoading(false);
                        return;
                    }

                    staffList = json.map((row, idx) => ({
                        TT: row["TT"] || (idx + 1),
                        HoTen: row["Họ tên"] || row["HoTen"] || "",
                        NamSinh: row["Năm sinh"] || row["NamSinh"] || "",
                        GioiTinh: row["Giới tính"] || row["GioiTinh"] || "Nam",
                        ChucVu: row["Chức vụ"] || row["ChucVu"] || "",
                        ToDanPho: row["Tổ dân phố"] || row["ToDanPho"] || "",
                        SoDienThoai: row["Số điện thoại"] || row["SoDienThoai"] || "",
                        NoiCuTru: row["Nơi cư trú"] || row["NoiCuTru"] || "",
                        Anh: row["Ảnh"] || row["Anh"] || ""
                    }));

                    autoReindexTT();
                    saveToLocalStorage();
                    updateDropdownFilters();
                    renderTable();
                    showToast("Nhập dữ liệu thành công!", "success");
                } catch (err) {
                    console.error(err);
                    showToast("Lỗi khi đọc file Excel!", "error");
                } finally {
                    showLoading(false);
                    e.target.value = "";
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function exportToExcel() {
            if (staffList.length === 0) {
                showToast("Không có dữ liệu để xuất!", "error");
                return;
            }

            showLoading(true);

            setTimeout(() => {
                try {
                    const exportData = staffList.map(item => ({
                        "TT": item.TT,
                        "Họ tên": item.HoTen,
                        "Năm sinh": item.NamSinh,
                        "Giới tính": item.GioiTinh,
                        "Chức vụ": item.ChucVu,
                        "Tổ dân phố": item.ToDanPho,
                        "Số điện thoại": item.SoDienThoai,
                        "Nơi cư trú": item.NoiCuTru,
                        "Ảnh": item.Anh
                    }));

                    const worksheet = XLSX.utils.json_to_sheet(exportData);
                    const workbook = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(workbook, worksheet, "DanhSach");
                    XLSX.writeFile(workbook, "DanhSachCanBo.xlsx");
                    showToast("Xuất Excel thành công!", "success");
                } catch (err) {
                    console.error(err);
                    showToast("Lỗi xuất file Excel!", "error");
                } finally {
                    showLoading(false);
                }
            }, 300);
        }

        function showToast(message, type = "success") {
            const toast = document.getElementById("toast");
            toast.innerText = message;
            toast.style.background = type === "error" ? "var(--accent-red)" : "var(--accent-green)";
            toast.style.display = "block";

            setTimeout(() => {
                toast.style.display = "none";
            }, 3000);
        }

        function showLoading(show) {
            document.getElementById("loading").style.display = show ? "flex" : "none";
        }
    </script>
</body>
</html>
